[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rabbitsense"
version = "0.3.7"
description = "Experimental rabbit tracking and motion analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "opencv-python>=4.8,<5"]

[tool.setuptools.packages.find]
where = ["src"]
